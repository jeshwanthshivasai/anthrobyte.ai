// ---------------------------------------------------------------------------
// OWN CURA — v2. Redesign: warmer, higher-contrast palette (forest / terracotta
// / cream) replacing the earlier navy/teal/coral system, a simple mark instead
// of a wordmark-only nav, softer elevation (shadows + hover states) for a more
// tactile, "user-friendly" feel, and a new MSO Partner Network page.
// ---------------------------------------------------------------------------

const FOREST = "#1B4332";     // primary — headers, nav active, trust band
const FOREST_DEEP = "#122B21";
const TERRACOTTA = "#C1502E"; // primary CTA / accent
const SAGE = "#4C7A6E";       // secondary accent — links, data highlights
const GOLD = "#B08900";       // caution / "building" state
const CREAM = "#FBF8F2";      // background
const CARD = "#FFFFFF";
const BORDER = "#E7E1D3";
const INK = "#22282A";
const MUTE = "#6E6A5F";

const serif = { fontFamily: "'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" };
const mono = { fontFamily: "'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace" };
const cardShadow = "0 1px 2px rgba(27,67,50,0.04), 0 4px 14px rgba(27,67,50,0.06)";
const cardShadowHover = "0 2px 6px rgba(27,67,50,0.08), 0 10px 26px rgba(27,67,50,0.10)";

function fmt(n) {
  if (n >= 1000000) return `$${(n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1)}M`;
  if (n >= 1000) return `$${Math.round(n / 1000)}K`;
  return `$${n}`;
}

function RangeBar({ low, high, small }) {
  return (
    <div>
      <div style={{ position: "relative", height: small ? 6 : 8, background: "#EDE8DA", borderRadius: 4 }}>
        <div style={{ position: "absolute", inset: 0, borderRadius: 4, background: `linear-gradient(90deg, ${SAGE}66, ${SAGE})` }} />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: small ? 11 : 12, color: MUTE, ...mono }}>
        <span>{fmt(low)}</span><span>{fmt(high)}</span>
      </div>
    </div>
  );
}

// --- helpers shared by the "Build & Run" toolkit (formerly OpenDoor) ------
function fmtFull(n) {
  const sign = n < 0 ? "-" : "";
  return `${sign}$${Math.abs(n).toLocaleString()}`;
}
const FUTURE_COLOR = "#6B5CA5";
const FUTURE_SOFT = "#EFEAF7";
const STATUS_STYLES = {
  CORE: { label: "CORE", color: SAGE, bg: SAGE + "17" },
  PILOT: { label: "PILOT", color: GOLD, bg: "#FBF3DC" },
  COMING: { label: "COMING SOON", color: TERRACOTTA, bg: TERRACOTTA + "14" },
  FUTURE: { label: "FUTURE", color: FUTURE_COLOR, bg: FUTURE_SOFT },
};
function StatusTag({ status }) {
  const s = STATUS_STYLES[status];
  return <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.6, color: s.color, background: s.bg, padding: "3px 9px", borderRadius: 20, ...mono }}>{s.label}</span>;
}
function ProgressBar({ percent }) {
  return (
    <div style={{ width: "100%", height: 10, background: BORDER, borderRadius: 6, overflow: "hidden" }}>
      <div style={{ width: `${percent}%`, height: "100%", background: `linear-gradient(90deg, ${SAGE}, ${FOREST})`, borderRadius: 6, transition: "width .3s ease" }} />
    </div>
  );
}

function Card({ children, style, hoverable, onClick }) {
  const [hover, setHover] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => hoverable && setHover(true)}
      onMouseLeave={() => hoverable && setHover(false)}
      style={{
        background: CARD, border: `1px solid ${BORDER}`, borderRadius: 14,
        boxShadow: hover ? cardShadowHover : cardShadow,
        transform: hover ? "translateY(-2px)" : "none",
        transition: "box-shadow .18s ease, transform .18s ease, border-color .18s ease",
        cursor: onClick ? "pointer" : "default",
        borderColor: hover ? SAGE + "55" : BORDER,
        ...style,
      }}>
      {children}
    </div>
  );
}

function Logo({ size = 30 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="19" stroke={FOREST} strokeWidth="2" />
      <path d="M20 10 C24 14 26 17 26 21 C26 25.4 23.3 28 20 28 C16.7 28 14 25.4 14 21 C14 17 16 14 20 10 Z"
        fill={TERRACOTTA} />
      <path d="M20 14 V25" stroke={CREAM} strokeWidth="1.4" strokeLinecap="round" />
    </svg>
  );
}

const STATES = ["Texas", "California"];

// attached to a named practice. Everything else on the homepage is aggregate
// market context, never a number invented for a practice that hasn't listed.

function NavButton({ active, children, onClick }) {
  const [hover, setHover] = useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        background: "none", border: "none", cursor: "pointer", fontSize: 13.5, padding: "6px 2px",
        color: active ? FOREST : hover ? INK : MUTE, fontWeight: active ? 700 : 500,
        borderBottom: active ? `2px solid ${TERRACOTTA}` : "2px solid transparent",
        transition: "color .15s ease",
      }}>
      {children}
    </button>
  );
}

function Nav({ view, setView }) {
  const roleItems = [["pvi", "I'm Buying"], ["path", "I'm Selling"], ["learn", "I'm Learning"], ["mso", "I'm an MSO"], ["partners", "I'm a Broker"]];
  return (
    <div style={{ position: "sticky", top: 0, zIndex: 40, background: CREAM + "F2", backdropFilter: "blur(6px)", borderBottom: `1px solid ${BORDER}` }}>
      <div style={{ maxWidth: 1200, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 28px", flexWrap: "wrap", gap: 10 }}>
        <div onClick={() => setView("home")} style={{ cursor: "pointer", display: "flex", alignItems: "center", gap: 10 }}>
          <Logo />
          <div>
            <div style={{ ...serif, fontSize: 19, fontWeight: 700, color: FOREST, lineHeight: 1 }}>Own Cura</div>
            <div style={{ fontSize: 9.5, color: SAGE, ...mono, letterSpacing: 1, marginTop: 2 }}>GROW YOUR PRACTICE</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 20, alignItems: "center", flexWrap: "wrap" }}>
          {roleItems.map(([key, label]) => (
            <NavButton key={key} active={view === key} onClick={() => setView(key)}>{label}</NavButton>
          ))}
          <NavButton active={view === "valuation"} onClick={() => setView("valuation")}>Value My Practice</NavButton>
        </div>
      </div>
    </div>
  );
}

function CTAButton({ children, onClick, variant = "primary", icon: Icon }) {
  const [hover, setHover] = useState(false);
  const styles = {
    primary: { background: hover ? "#A8431F" : TERRACOTTA, color: "#fff", border: "none" },
    outline: { background: hover ? FOREST + "0D" : "transparent", color: FOREST, border: `1.5px solid ${FOREST}` },
    dark: { background: hover ? FOREST_DEEP : FOREST, color: "#fff", border: "none" },
  }[variant];
  return (
    <button onClick={onClick} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ ...styles, borderRadius: 9, padding: "13px 22px", fontSize: 14, fontWeight: 600, cursor: "pointer",
        display: "inline-flex", alignItems: "center", gap: 8, transition: "background .15s ease" }}>
      {children} {Icon && <Icon size={15} />}
    </button>

}

function ListingCard({ item, onOpen }) {
  return (
    <Card hoverable onClick={() => onOpen(item)} style={{ padding: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          <div style={{ display: "flex", gap: 6 }}>
            <span style={{ fontSize: 10, ...mono, letterSpacing: 0.5, color: SAGE, background: SAGE + "17", padding: "3px 8px", borderRadius: 12 }}>LISTED</span>
            {item.teaching && (
              <span style={{ fontSize: 10, ...mono, letterSpacing: 0.5, color: TERRACOTTA, background: TERRACOTTA + "14", padding: "3px 8px", borderRadius: 12, display: "flex", alignItems: "center", gap: 3 }}>
                <GraduationCap size={10} /> TEACHING SITE
              </span>
            )}
          </div>
          <div style={{ ...serif, fontSize: 16.5, fontWeight: 700, color: FOREST, marginTop: 10 }}>{item.name}</div>
          <div style={{ fontSize: 11.5, color: MUTE, marginTop: 3 }}>{item.specialty} · {item.city}</div>
        </div>
      </div>
      <div style={{ marginTop: 16 }}>
        <div style={{ ...serif, fontSize: 19, color: FOREST, fontWeight: 700 }}>{fmt(item.low)} – {fmt(item.high)}</div>
        <div style={{ marginTop: 8 }}><RangeBar low={item.low} high={item.high} small /></div>
      </div>
      <div style={{ fontSize: 11, color: MUTE, marginTop: 10 }}>Real range, from this practice's own numbers.</div>
    </Card>
  );
}

function MarketRangeCard({ spec, state, setView }) {
  const d = SPECIALTY_DATA[spec];
  return (
    <Card style={{ padding: 20, background: "#F3F0E6" }}>
      <span style={{ fontSize: 10, ...mono, letterSpacing: 0.5, color: MUTE, background: "#E7E1D0", padding: "3px 8px", borderRadius: 12 }}>MARKET RANGE · NO LISTING</span>
      <div style={{ ...serif, fontSize: 16.5, fontWeight: 700, color: FOREST, marginTop: 10 }}>{spec}</div>
      <div style={{ fontSize: 11.5, color: MUTE, marginTop: 3 }}>{state} · not a specific practice</div>
      {d.ready ? (
        <div style={{ marginTop: 16 }}>
          <div style={{ ...serif, fontSize: 18, color: FOREST, fontWeight: 700 }}>{d.low}x – {d.high}x EBITDA</div>
          <div style={{ fontSize: 11, color: MUTE, marginTop: 8 }}>Aggregate range across {d.comps} comparable transactions we've reviewed — no one practice's numbers.</div>
        </div>
      ) : (
        <div style={{ marginTop: 14, fontSize: 11.5, color: "#8A6D1F", lineHeight: 1.5 }}>
          Not enough comparable data yet for a reliable range in this specialty.
        </div>
      )}
      <button onClick={() => setView("valuation")} style={{ marginTop: 12, background: "none", border: "none", padding: 0, color: TERRACOTTA, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
        Get a number specific to your practice →

}

function ValuationTool() {
  const [specialty, setSpecialty] = useState("Pediatrics");
  const [ebitda, setEbitda] = useState(280000);
  const [providers, setProviders] = useState(3);
  const [done, setDone] = useState(false);
  const d = SPECIALTY_DATA[specialty];
  const scaleAdj = providers >= 5 ? 0.2 : providers >= 3 ? 0.05 : 0;
  const low = d.ready ? Math.round(ebitda * (d.low + scaleAdj)) : null;
  const high = d.ready ? Math.round(ebitda * (d.high + scaleAdj)) : null;

  return (
    <div style={{ maxWidth: 700, margin: "0 auto", padding: "52px 28px 100px" }}>
      <SectionHeader eyebrow="PILLAR 1" title="Value My Practice"
        body="A comparables-based estimate, not a formal appraisal — based on transactions we've reviewed for your specialty and size." />
      {!done ? (
        <Card style={{ padding: 28 }}>
          <label style={{ fontSize: 12.5, color: MUTE }}>Specialty</label>
          <select value={specialty} onChange={(e) => setSpecialty(e.target.value)} style={{ width: "100%", marginTop: 6, marginBottom: 18, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "10px 12px", fontSize: 14, background: "#fff" }}>
            {SPECIALTIES.map((s) => <option key={s}>{s}</option>)}
          </select>
          {!d.ready && (
            <div style={{ marginBottom: 18, padding: 12, background: "#FBF3DC", borderRadius: 8, fontSize: 12.5, color: "#8A6D1F", display: "flex", gap: 8 }}>
              <Info size={14} style={{ flexShrink: 0, marginTop: 1 }} />
              We don't have enough comparable transactions in {specialty.toLowerCase()} yet for a reliable range. You can still submit — we'll follow up personally as we add more data.
            </div>
          )}
          <label style={{ fontSize: 12.5, color: MUTE }}>EBITDA / SDE: <span style={{ ...mono, color: FOREST }}>{fmt(ebitda)}</span></label>
          <input type="range" min={50000} max={1500000} step={10000} value={ebitda} onChange={(e) => setEbitda(Number(e.target.value))} style={{ width: "100%", marginTop: 8, marginBottom: 18, accentColor: SAGE }} />
          <label style={{ fontSize: 12.5, color: MUTE }}>Number of providers: <span style={{ ...mono, color: FOREST }}>{providers}</span></label>
          <input type="range" min={1} max={10} step={1} value={providers} onChange={(e) => setProviders(Number(e.target.value))} style={{ width: "100%", marginTop: 8, marginBottom: 24, accentColor: SAGE }} />
          <CTAButton onClick={() => setDone(true)}>{d.ready ? "Get my indicative range" : "Submit anyway — notify me"}</CTAButton>
        </Card>
      ) : (
        <Card style={{ padding: 28 }}>
          {d.ready ? (
            <>
              <div style={{ fontSize: 12.5, color: MUTE }}>Indicative range for a {specialty.toLowerCase()} practice, {providers} provider{providers > 1 ? "s" : ""}</div>
              <div style={{ ...serif, fontSize: 33, color: FOREST, fontWeight: 700, marginTop: 8 }}>{fmt(low)} – {fmt(high)}</div>
              <div style={{ marginTop: 16 }}><RangeBar low={low} high={high} /></div>
              <div style={{ marginTop: 20, fontSize: 12.5, color: "#42463E", lineHeight: 1.6 }}>
                Based on {d.comps} comparable {specialty.toLowerCase()} transactions we've reviewed. Not a formal appraisal —
                we recommend an independent valuation and legal/accounting review before any transaction.
              </div>
            </>
          ) : (
            <>
              <div style={{ ...serif, fontSize: 20, color: FOREST, fontWeight: 700 }}>Thanks — you're on the list.</div>
              <div style={{ marginTop: 10, fontSize: 13, color: "#42463E", lineHeight: 1.6 }}>
                We don't have enough {specialty.toLowerCase()} comps yet for a reliable range. We'll reach out
                personally as soon as we do.
              </div>
            </>
          )}
          <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
            <CTAButton onClick={() => setDone(false)} variant="outline">Adjust inputs</CTAButton>
            <CTAButton variant="dark">Talk to Own Cura</CTAButton>
          </div>
        </Card>
      )}
    </div>
  );
}

const BUILD_SPECIALTIES = ["Family Medicine", "Internal Medicine", "Dermatology", "Pediatrics", "Psychiatry", "Cardiology", "Orthopedics"];

function BuildOnboarding({ initial, onComplete }) {
  const [step, setStep] = useState(0);
  const [data, setData] = useState({ specialty: initial?.specialty || "", location: initial?.location || "", scenario: initial?.specialty ? "acquiring" : "", type: "", date: "" });
  const steps = ["Specialty", "Location", "Starting point", "Practice type", "Target date"];
  function update(field, value) { setData((d) => ({ ...d, [field]: value })); }
  function next() { step < steps.length - 1 ? setStep(step + 1) : onComplete(data); }

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "50px 28px 100px" }}>
      <SectionHeader eyebrow="BUILD YOUR PRACTICE" title="Let's build your blueprint" body="A few questions — takes about a minute." />
      <div style={{ display: "flex", gap: 6, marginBottom: 26 }}>
        {steps.map((s, i) => <div key={s} style={{ flex: 1, height: 4, borderRadius: 4, background: i <= step ? SAGE : BORDER }} />)}
      </div>
      <Card style={{ padding: 30 }}>
        {step === 0 && (<>
          <div style={{ fontSize: 15.5, fontWeight: 700, color: FOREST, marginBottom: 16 }}>What's your specialty?</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
            {BUILD_SPECIALTIES.map((s) => (
              <button key={s} onClick={() => update("specialty", s)} style={{ padding: "10px 16px", borderRadius: 10, fontSize: 13.5, cursor: "pointer",
                border: `1.5px solid ${data.specialty === s ? SAGE : BORDER}`, background: data.specialty === s ? SAGE + "14" : "#fff", color: data.specialty === s ? SAGE : INK, fontWeight: 600 }}>{s}</button>
            ))}
          </div>
        </>)}
        {step === 1 && (<>
          <div style={{ fontSize: 15.5, fontWeight: 700, color: FOREST, marginBottom: 16 }}>Where do you want to practice?</div>
          <input value={data.location} onChange={(e) => update("location", e.target.value)} placeholder="City, state"
            style={{ width: "100%", border: `1px solid ${BORDER}`, borderRadius: 10, padding: "12px 14px", fontSize: 14.5 }} />
        </>)}
        {step === 2 && (<>
          <div style={{ fontSize: 15.5, fontWeight: 700, color: FOREST, marginBottom: 16 }}>Where are you starting from?</div>
          {SCENARIOS.map((s) => (
            <button key={s.key} onClick={() => update("scenario", s.key)} style={{ display: "block", width: "100%", textAlign: "left", padding: "14px 16px", borderRadius: 10, marginBottom: 10, cursor: "pointer",

          ))}
        </>)}
        {step === 3 && (<>
          <div style={{ fontSize: 15.5, fontWeight: 700, color: FOREST, marginBottom: 16 }}>Insurance, cash-pay, or hybrid?</div>
          <div style={{ display: "flex", gap: 10 }}>
            {PRACTICE_TYPES.map((t) => (
              <button key={t} onClick={() => update("type", t)} style={{ flex: 1, padding: "14px 0", borderRadius: 10, cursor: "pointer",
                border: `1.5px solid ${data.type === t ? SAGE : BORDER}`, background: data.type === t ? SAGE + "14" : "#fff", color: INK, fontSize: 14, fontWeight: 600 }}>{t}</button>
            ))}
          </div>
        </>)}
        {step === 4 && (<>
          <div style={{ fontSize: 15.5, fontWeight: 700, color: FOREST, marginBottom: 16 }}>Desired opening date?</div>

        </>)}
        <div style={{ marginTop: 24 }}><CTAButton onClick={next} icon={ArrowRight}>{step < steps.length - 1 ? "Continue" : "Build my blueprint"}</CTAButton></div>
      </Card>
    </div>
  );

function BuildApp({ profile, onExit }) {
  const [buildView, setBuildView] = useState(profile ? "blueprint" : "onboarding");
  const [finalProfile, setFinalProfile] = useState(profile && (profile.specialty || profile.location) ? profile : null);
  const items = [["blueprint", "Blueprint"], ["buildMarketplace", "Build Marketplace"], ["run", "Run Your Practice"], ["financial", "Financial"], ["network", "Network & Engine"]];
  return (
    <div style={{ background: CREAM, minHeight: "100vh" }}>
      <div style={{ position: "sticky", top: 0, zIndex: 40, background: FOREST, color: "#fff" }}>
        <div style={{ maxWidth: 1200, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 28px", flexWrap: "wrap", gap: 10 }}>
          <button onClick={onExit} style={{ background: "none", border: "none", color: "#DCE7E1", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 600 }}>
            <ArrowLeft size={15} /> Back to Own Cura
          </button>
          <div style={{ display: "flex", gap: 18, flexWrap: "wrap" }}>
            {items.map(([k, l]) => (
              <button key={k} onClick={() => setBuildView(k)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 13, padding: "4px 2px",
                color: buildView === k ? "#fff" : "#B7CBBF", fontWeight: buildView === k ? 700 : 500, borderBottom: buildView === k ? `2px solid ${TERRACOTTA}` : "2px solid transparent" }}>{l}</button>
            ))}
          </div>
          <span style={{ fontSize: 10, ...mono, color: "#9FBDAE", letterSpacing: 0.5, whiteSpace: "nowrap" }}>POWERED BY INDEPENDENCE OS</span>
        </div>
      </div>
      {buildView === "onboarding" && <BuildOnboarding initial={profile} onComplete={(p) => { setFinalProfile(p); setBuildView("blueprint"); }} />}
      {buildView === "blueprint" && <Blueprint profile={finalProfile || profile || {}} goTo={setBuildView} />}
      {buildView === "buildMarketplace" && <BuildMarketplace />}
      {buildView === "run" && <RunYourPractice />}
      {buildView === "financial" && <BuildFinancial />}
      {buildView === "network" && <BuildNetwork />}
      <div style={{ borderTop: `1px solid ${BORDER}`, padding: "22px 28px", textAlign: "center", fontSize: 11.5, color: MUTE }}>
        Build & Run — part of Own Cura, powered by Independence OS. Sample data is illustrative; PILOT and FUTURE items are not currently live.
      </div>
    </div>
  );
}

function OwnCuraPlatformV2() {
  const [view, setView] = useState("home");
  const [buildMode, setBuildMode] = useState(false);
  const [buildProfile, setBuildProfile] = useState(null);

  function startBuild(profile) {
    setBuildProfile(profile);
    setBuildMode(true);
  }

  if (buildMode) {
    return <BuildApp profile={buildProfile} onExit={() => setBuildMode(false)} />;
  }

  return (
    <div style={{ background: CREAM, minHeight: "100vh", color: INK, fontFamily: "system-ui, -apple-system, sans-serif" }}>
      <Nav view={view} setView={setView} />
      {view === "home" && (<><HomeSearch setView={setView} onStartBuild={startBuild} /><Pillars setView={setView} /><TrustBand /></>)}
      {view === "pvi" && <PVI setView={setView} />}
      {view === "valuation" && <ValuationTool />}
      {view === "path" && <FindPath />}
      {view === "learn" && <LearnTrain />}
      {view === "mso" && <MSONetwork />}
      {view === "partners" && <Partners />}
      <div style={{ borderTop: `1px solid ${BORDER}`, padding: "24px 28px", textAlign: "center", fontSize: 12, color: MUTE }}>
        Own Cura — built by Roots Health. Prototype for internal review, sample data only.
      </div>
    </div>
  );
}
