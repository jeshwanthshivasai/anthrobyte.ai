<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@1,6..72,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#f4f2ee}a{color:#17130f}a:hover{color:#FF6028}</style>
</helmet>
<div style="position:relative;width:1180px;height:760px;background:#f4f2ee;font-family:'Space Grotesk',sans-serif;color:#17130f;overflow:hidden">
  <div style="position:absolute;left:66px;top:118px">
    <div style="font:600 40px/1 'Space Grotesk',sans-serif;letter-spacing:-.04em">Complexity is</div>
    <div style="font:italic 400 108px/0.96 'Newsreader',serif;color:#FF6028;margin:10px 0 0 -6px">Layered.</div>
    <div style="margin-top:26px;display:inline-block;background:rgba(23,19,15,.045);border-radius:10px;padding:14px 18px;font:400 15.5px/1.6 'Space Grotesk',sans-serif;color:rgba(26,21,16,.66)">Leadership intent shapes operations below.<br>Ground realities reshape strategy above.</div>
  </div>
  <div style="position:absolute;left:66px;bottom:64px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;gap:12px;align-items:baseline"><span style="width:3px;height:20px;background:#FF6028;display:inline-block;transform:translateY(3px)"></span><span style="font:italic 400 20px 'Newsreader',serif">Clarity must precede deployment.</span></div>
    <span style="font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.28em;color:rgba(26,21,16,.68);border-bottom:1px solid #FF6028;padding-bottom:5px;width:max-content">NAVIGATE COMPLEXITY WITH US &#8594;</span>
  </div>
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
    <div style="position:absolute;left:{{ r.lx }}px;top:{{ r.ly }}px;display:flex;align-items:center;gap:10px">
      <span style="font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.26em;color:rgba(26,21,16,.62)">{{ r.name }}</span>
      <span style="width:{{ r.len }}px;height:1px;background:rgba(23,19,15,.28);display:inline-block"></span>
      <span style="width:5px;height:5px;border-radius:50%;background:#17130f;display:inline-block"></span>
    </div>
    <div style="position:absolute;left:{{ r.px }}px;top:{{ r.py }}px;width:150px;height:96px;background:#0d0b0a;border-radius:52% 52% 12% 12% / 62% 62% 14% 14%;transform:rotate(-34deg);box-shadow:inset -3px -5px 9px rgba(196,110,58,.5), inset 2px 3px 5px rgba(255,170,110,.18)"></div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1180, &quot;height&quot;: 760}}">
class Component extends DCLogic {
  renderVals() {
    const names = ['INTENT', 'STRATEGY', 'PLANNING', 'OPERATIONS', 'GROUND'];
    return { rows: names.map((name, i) => ({
      name, lx: 620 - i * 34, ly: 92 + i * 128, len: 150 + i * 18, px: 928 - i * 44, py: 58 + i * 126
    })) };
  }
}
</script>
</body>
</html>
