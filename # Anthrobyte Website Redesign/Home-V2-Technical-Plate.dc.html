<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#0A0A0B;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#FF6028;text-decoration:none}
a:hover{color:#FF8557}
::selection{background:#FF6028;color:#0A0A0B}
</style>
</helmet>

<div style="position:relative;background:#0A0A0B;font-family:Archivo,sans-serif">

  <div ref="{{ setNav }}" style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:rgba(10,10,11,.86);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,96,40,.16);transform:translateY(-100%);transition:transform .5s cubic-bezier(.22,1,.36,1)">
    <span style="font:500 11.5px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#EFEDE9">ANTHROBYTE</span>
    <div style="display:flex;align-items:center;gap:28px">
      <span style="font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#75787E">AATLAS</span>
      <span style="font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#75787E">TRANSFORMATION</span>
      <span style="font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#75787E">JOURNAL</span>
      <span style="font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#FF6028">LET'S TALK</span>
    </div>
  </div>

  <div ref="{{ setWrap }}" style="position:relative;height:260vh">
    <div style="position:sticky;top:0;height:100vh;overflow:hidden">

      <div ref="{{ setMount }}" style="position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:78%;height:88%"></div>

      <svg viewBox="0 0 1440 900" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
        <rect x="30" y="30" width="1380" height="840" fill="none" stroke="#FF6028" stroke-opacity=".2" stroke-width="1"></rect>
        <rect x="42" y="42" width="1356" height="816" fill="none" stroke="#FF6028" stroke-opacity=".08" stroke-width="1"></rect>
        <path d="M30 30 L78 30 M30 30 L30 78" stroke="#FF6028" stroke-opacity=".6" stroke-width="2"></path>
        <path d="M1410 30 L1362 30 M1410 30 L1410 78" stroke="#FF6028" stroke-opacity=".6" stroke-width="2"></path>
        <path d="M30 870 L78 870 M30 870 L30 822" stroke="#FF6028" stroke-opacity=".6" stroke-width="2"></path>
        <path d="M1410 870 L1362 870 M1410 870 L1410 822" stroke="#FF6028" stroke-opacity=".6" stroke-width="2"></path>
        <g stroke="#FF6028" stroke-opacity=".28" stroke-width="1">
          <path d="M330 30 L330 46 M630 30 L630 46 M930 30 L930 46 M1230 30 L1230 46"></path>
          <path d="M330 870 L330 854 M630 870 L630 854 M930 870 L930 854 M1230 870 L1230 854"></path>
          <path d="M30 250 L46 250 M30 450 L46 450 M30 650 L46 650"></path>
          <path d="M1410 250 L1394 250 M1410 450 L1394 450 M1410 650 L1394 650"></path>
        </g>
      </svg>

      <svg ref="{{ setAnno }}" viewBox="0 0 1440 900" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
        <g stroke="#FF6028" fill="none" stroke-width="1">
          <path d="M780 262 L1046 262 L1082 226" stroke-opacity=".5" stroke-dasharray="420" stroke-dashoffset="420" data-draw="1"></path>
          <path d="M742 392 L1030 392" stroke-opacity=".42" stroke-dasharray="300" stroke-dashoffset="300" data-draw="1"></path>
          <path d="M700 512 L360 512" stroke-opacity=".42" stroke-dasharray="360" stroke-dashoffset="360" data-draw="1"></path>
          <path d="M754 620 L1024 620 L1060 656" stroke-opacity=".38" stroke-dasharray="420" stroke-dashoffset="420" data-draw="1"></path>
        </g>
        <circle cx="780" cy="262" r="2.8" fill="#FF6028"></circle>
        <circle cx="742" cy="392" r="2.8" fill="#FF6028"></circle>
        <circle cx="700" cy="512" r="2.8" fill="#FF6028"></circle>
        <circle cx="754" cy="620" r="2.8" fill="#FF6028"></circle>
        <text x="1092" y="222" fill="#C0BCB4" style="font:500 11.5px 'JetBrains Mono',monospace;letter-spacing:.16em">A · INTENT</text>
        <text x="1042" y="389" fill="#C0BCB4" style="font:500 11.5px 'JetBrains Mono',monospace;letter-spacing:.16em">B · PLANNING</text>
        <text x="356" y="509" text-anchor="end" fill="#C0BCB4" style="font:500 11.5px 'JetBrains Mono',monospace;letter-spacing:.16em">C · EXECUTION</text>
        <text x="1070" y="661" fill="#75787E" style="font:500 11.5px 'JetBrains Mono',monospace;letter-spacing:.16em">D · GROUND TRUTH</text>
      </svg>

      <div style="position:absolute;left:62px;top:62px;display:flex;flex-direction:column;gap:5px">
        <span style="font:700 11px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#EFEDE9">ANTHROBYTE</span>
        <span style="font:400 10px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#4E5157">DWG AB—TRF—001</span>
      </div>
      <div style="position:absolute;right:62px;top:62px;text-align:right;display:flex;flex-direction:column;gap:5px">
        <span style="font:400 10px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#4E5157">SHEET 01 / 07</span>
        <span style="font:400 10px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#4E5157">SCALE 1:1</span>
      </div>

      <div style="position:absolute;left:62px;bottom:62px;max-width:620px;border-top:1px solid rgba(255,96,40,.28);padding-top:22px">
        <div style="display:flex;gap:30px;margin-bottom:20px">
          <span style="font:400 10px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#4E5157">TITLE</span>
          <span style="font:400 10px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#4E5157">REV 2026.08</span>
          <span style="font:400 10px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#4E5157">MINNEAPOLIS · HYDERABAD</span>
        </div>
        <div style="position:relative;overflow:hidden">
          <div ref="{{ setHA }}" style="will-change:transform">
            <h1 style="font:600 clamp(27px,2.9vw,42px)/1.16 Archivo,sans-serif;font-stretch:92%;letter-spacing:-.026em;color:#F0EEEA;margin:0;text-wrap:pretty">AI is not a capability you add.</h1>
          </div>
          <div ref="{{ setHB }}" style="position:absolute;inset:0;will-change:transform;opacity:0">
            <h1 style="font:600 clamp(27px,2.9vw,42px)/1.16 Archivo,sans-serif;font-stretch:92%;letter-spacing:-.026em;color:#F0EEEA;margin:0;text-wrap:pretty">It's a layer that changes what's underneath.</h1>
          </div>
        </div>
      </div>

      <div style="position:absolute;right:62px;bottom:62px;text-align:right">
        <span ref="{{ setSep }}" style="font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#FF6028">SEPARATION 0.00</span>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    return {
      setMount: (el) => { this.mount = el; },
      setWrap: (el) => { this.wrap = el; },
      setHA: (el) => { this.ha = el; },
      setHB: (el) => { this.hb = el; },
      setAnno: (el) => { this.anno = el; },
      setNav: (el) => { this.nav = el; },
      setSep: (el) => { this.sep = el; }
    };
  }

  componentDidMount() {
    this.p = 0; this.pt = 0; this.mx = 0; this.my = 0; this.lastY = window.scrollY;
    this.onScroll = () => {
      const y = window.scrollY;
      if (this.nav) {
        const up = y < this.lastY - 2;
        this.nav.style.transform = (up && y > 200) ? 'translateY(0)' : 'translateY(-100%)';
      }
      this.lastY = y;
      if (!this.wrap) return;
      const r = this.wrap.getBoundingClientRect();
      const span = r.height - window.innerHeight;
      this.pt = span > 0 ? Math.min(1, Math.max(0, -r.top / span)) : 0;
    };
    this.onMove = (e) => {
      this.mx = (e.clientX / window.innerWidth - 0.5) * 2;
      this.my = (e.clientY / window.innerHeight - 0.5) * 2;
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('mousemove', this.onMove, { passive: true });
    this.onScroll();
    this.boot();
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('mousemove', this.onMove);
    if (this.ro) this.ro.disconnect();
    if (this.renderer) { this.renderer.dispose(); this.renderer.domElement.remove(); }
  }

  blade(THREE) {
    const D = 1.0, R = 0.769, CH = 0.620, AX = 0.7546, CY = 0.852, CTL = 0.740;
    const s = new THREE.Shape();
    s.moveTo(CH, D);
    s.lineTo(-CH, D);
    s.quadraticCurveTo(-CTL, D, -AX, CY);
    s.absarc(0, D, R, Math.PI * 1.0617, Math.PI * 1.9383, false);
    s.quadraticCurveTo(CTL, D, CH, D);
    return s;
  }

  async boot() {
    const THREE = await import('https://esm.sh/three@0.161.0');
    const el = this.mount; if (!el) return;
    const w = el.clientWidth || 900, h = el.clientHeight || 760;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.domElement.style.display = 'block';
    el.appendChild(renderer.domElement);
    this.renderer = renderer;

    const scene = new THREE.Scene();
    const D = 1.62, aspect = w / h;
    const camera = new THREE.OrthographicCamera(-D * aspect, D * aspect, D, -D, -30, 60);
    camera.position.set(2.6, 2.0, 2.6);
    camera.lookAt(0, 0, 0);
    this.D = D;

    const geo = new THREE.ExtrudeGeometry(this.blade(THREE), {
      depth: 0.05, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.006, bevelSegments: 2, curveSegments: 36
    });
    geo.rotateX(-Math.PI / 2);

    const mA = new THREE.MeshStandardMaterial({ color: 0x14151A, metalness: 0.6, roughness: 0.4 });
    const mB = new THREE.MeshStandardMaterial({ color: 0x1F2027, metalness: 0.48, roughness: 0.5 });
    const mHot = new THREE.MeshStandardMaterial({ color: 0xFF6028, emissive: 0xFF3B00, emissiveIntensity: 0.62, metalness: 0.24, roughness: 0.36 });

    const edgeGeo = new THREE.EdgesGeometry(geo, 25);
    const edgeMat = new THREE.LineBasicMaterial({ color: 0xFF6028, transparent: true, opacity: 0.14 });

    const stack = new THREE.Group();
    const N = 14;
    this.strata = [];
    for (let i = 0; i < N; i++) {
      const layer = new THREE.Group();
      const t = i / (N - 1);
      const mat = (i === 3 || i === 10) ? mHot : (i % 2 ? mB : mA);
      for (let b = 0; b < 3; b++) {
        const m = new THREE.Mesh(geo, mat);
        m.rotation.y = (b / 3) * Math.PI * 2;
        const s = 1 - Math.abs(t - 0.5) * 0.14;
        m.scale.set(s, 1, s);
        layer.add(m);
        const ln = new THREE.LineSegments(edgeGeo, edgeMat);
        ln.rotation.y = m.rotation.y; ln.scale.copy(m.scale);
        layer.add(ln);
      }
      layer.userData.base = i - (N - 1) / 2;
      stack.add(layer);
      this.strata.push(layer);
    }
    scene.add(stack);

    scene.add(new THREE.HemisphereLight(0x363B48, 0x08090B, 0.9));
    const key = new THREE.DirectionalLight(0xFFFFFF, 2.0); key.position.set(3.2, 6.0, 3.4); scene.add(key);
    const rim = new THREE.DirectionalLight(0xFFFFFF, 1.0); rim.position.set(-4.0, 1.0, -3.2); scene.add(rim);
    const glow = new THREE.PointLight(0xFF6028, 18, 12, 2); glow.position.set(-1.8, -1.0, 2.0); scene.add(glow);

    this.ro = new ResizeObserver(() => {
      const nw = el.clientWidth, nh = el.clientHeight;
      if (!nw || !nh) return;
      const a = nw / nh;
      camera.left = -this.D * a; camera.right = this.D * a; camera.top = this.D; camera.bottom = -this.D;
      camera.updateProjectionMatrix();
      renderer.setSize(nw, nh);
    });
    this.ro.observe(el);

    const paths = this.anno ? Array.from(this.anno.querySelectorAll('[data-draw]')) : [];
    const lens = paths.map(p => p.getTotalLength ? p.getTotalLength() : 400);

    const tick = () => {
      this.raf = requestAnimationFrame(tick);
      this.p += (this.pt - this.p) * 0.07;
      const p = this.p;

      const gap = 0.0585 + p * 0.30;
      for (let i = 0; i < this.strata.length; i++) {
        const L = this.strata[i];
        L.position.y = L.userData.base * gap;
        L.rotation.y = i * p * 0.105;
      }
      stack.rotation.y = p * 0.5;

      const rad = 0.03 + p * 2.86;
      camera.position.set(rad * 0.7071 + this.mx * 0.14, 3.72 - p * 1.72 - this.my * 0.12, rad * 0.7071);
      camera.lookAt(0, 0, 0);
      this.D = 1.62 + p * 0.42;
      const a2 = (el.clientWidth || w) / (el.clientHeight || h);
      camera.left = -this.D * a2; camera.right = this.D * a2; camera.top = this.D; camera.bottom = -this.D;
      camera.updateProjectionMatrix();

      const t = Math.min(1, Math.max(0, (p - 0.18) / 0.28));
      if (this.ha) { this.ha.style.transform = 'translateY(' + (-t * 110) + '%)'; this.ha.style.opacity = String(1 - t); }
      if (this.hb) { this.hb.style.transform = 'translateY(' + ((1 - t) * 110) + '%)'; this.hb.style.opacity = String(t); }

      const d = Math.min(1, Math.max(0, (p - 0.05) / 0.42));
      for (let i = 0; i < paths.length; i++) {
        const local = Math.min(1, Math.max(0, (d - i * 0.11) / 0.5));
        paths[i].style.strokeDashoffset = String(lens[i] * (1 - local));
      }
      if (this.sep) this.sep.textContent = 'SEPARATION ' + (gap * 10).toFixed(2);

      renderer.render(scene, camera);
    };
    tick();
  }
}

</script>
</body>
</html>
