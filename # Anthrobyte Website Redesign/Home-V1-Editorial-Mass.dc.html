<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#08080A;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#FF6028;text-decoration:none}
a:hover{color:#FF8557}
::selection{background:#FF6028;color:#08080A}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>

<div style="position:relative;background:#08080A;font-family:Archivo,sans-serif">

  <div ref="{{ setNav }}" style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 40px;background:rgba(8,8,10,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06);transform:translateY(-100%);transition:transform .5s cubic-bezier(.22,1,.36,1)">
    <span style="font:600 15px/1 Archivo,sans-serif;font-stretch:95%;letter-spacing:-.035em;color:#EFEDE9">anthrobyte</span>
    <div style="display:flex;align-items:center;gap:30px">
      <span style="font:400 11.5px/1 'JetBrains Mono',monospace;letter-spacing:.04em;color:#7E7A73">AAtlas</span>
      <span style="font:400 11.5px/1 'JetBrains Mono',monospace;letter-spacing:.04em;color:#7E7A73">Transformation</span>
      <span style="font:400 11.5px/1 'JetBrains Mono',monospace;letter-spacing:.04em;color:#7E7A73">Journal</span>
      <span style="font:500 11.5px/1 'JetBrains Mono',monospace;letter-spacing:.04em;color:#FF6028">Let's talk</span>
    </div>
  </div>

  <div ref="{{ setWrap }}" style="position:relative;height:260vh">
    <div style="position:sticky;top:0;height:100vh;overflow:hidden">

      <div ref="{{ setMount }}" style="position:absolute;right:-6%;top:8%;width:60%;height:84%"></div>

      <svg ref="{{ setAnno }}" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet" style="position:absolute;right:-6%;top:8%;width:60%;height:84%;pointer-events:none;overflow:visible">
        <g stroke="#FF6028" fill="none" stroke-width="1">
          <path d="M470 250 L640 250 L676 214" stroke-opacity=".55" stroke-dasharray="300" stroke-dashoffset="300" data-draw="1"></path>
          <path d="M430 400 L610 400" stroke-opacity=".45" stroke-dasharray="200" stroke-dashoffset="200" data-draw="1"></path>
          <path d="M446 560 L628 560 L664 596" stroke-opacity=".45" stroke-dasharray="300" stroke-dashoffset="300" data-draw="1"></path>
          <path d="M300 690 L300 762 L470 762" stroke-opacity=".3" stroke-dasharray="260" stroke-dashoffset="260" data-draw="1"></path>
        </g>
        <circle cx="470" cy="250" r="2.6" fill="#FF6028"></circle>
        <circle cx="430" cy="400" r="2.6" fill="#FF6028"></circle>
        <circle cx="446" cy="560" r="2.6" fill="#FF6028"></circle>
        <circle cx="300" cy="690" r="2.6" fill="#FF6028"></circle>
        <text x="686" y="210" fill="#B9B4AC" style="font:500 15px 'JetBrains Mono',monospace;letter-spacing:.14em">INTENT</text>
        <text x="622" y="396" fill="#B9B4AC" style="font:500 15px 'JetBrains Mono',monospace;letter-spacing:.14em">PLANNING</text>
        <text x="674" y="601" fill="#B9B4AC" style="font:500 15px 'JetBrains Mono',monospace;letter-spacing:.14em">EXECUTION</text>
        <text x="482" y="767" fill="#6E6A63" style="font:500 15px 'JetBrains Mono',monospace;letter-spacing:.14em">GROUND TRUTH</text>
      </svg>

      <div style="position:absolute;left:44px;top:36px;display:flex;gap:24px">
        <span style="font:400 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#4E4B45">AB—TRF—001</span>
        <span style="font:400 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#4E4B45">REV 2026.08</span>
      </div>

      <div style="position:absolute;left:44px;bottom:120px;right:46%;pointer-events:none">
        <div style="position:relative;overflow:hidden">
          <div ref="{{ setHA }}" style="will-change:transform">
            <h1 style="font:700 clamp(52px,8.4vw,152px)/.9 Archivo,sans-serif;font-stretch:66%;letter-spacing:-.028em;color:#F2F0EC;margin:0;text-wrap:balance">AI is not a capability you add.</h1>
          </div>
          <div ref="{{ setHB }}" style="position:absolute;inset:0;will-change:transform;opacity:0">
            <h1 style="font:700 clamp(52px,8.4vw,152px)/.9 Archivo,sans-serif;font-stretch:66%;letter-spacing:-.028em;color:#F2F0EC;margin:0;text-wrap:balance">It's a layer that changes what's underneath.</h1>
          </div>
        </div>
      </div>

      <div style="position:absolute;left:44px;bottom:44px;display:flex;align-items:baseline;gap:18px">
        <span style="font:600 19px/1 Archivo,sans-serif;font-stretch:95%;letter-spacing:-.035em;color:#EFEDE9">anthrobyte</span>
        <span style="font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:#4E4B45">MINNEAPOLIS · HYDERABAD</span>
      </div>

      <div ref="{{ setBar }}" style="position:absolute;left:0;bottom:0;height:2px;background:#FF6028;width:0%"></div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    return {
      setMount: (el) => { this.mount = el; },
      setWrap: (el) => { this.wrap = el; },
      setHA: (el) => { this.ha = el; },
      setHB: (el) => { this.hb = el; },
      setAnno: (el) => { this.anno = el; },
      setNav: (el) => { this.nav = el; },
      setBar: (el) => { this.bar = el; }
    };
  }

  componentDidMount() {
    this.p = 0; this.pt = 0; this.mx = 0; this.my = 0; this.lastY = window.scrollY;
    this.onScroll = () => {
      const y = window.scrollY;
      if (this.nav) {
        const up = y < this.lastY - 2;
        this.nav.style.transform = (up && y > 200) ? 'translateY(0)' : 'translateY(-100%)';
      }
      this.lastY = y;
      if (!this.wrap) return;
      const r = this.wrap.getBoundingClientRect();
      const span = r.height - window.innerHeight;
      this.pt = span > 0 ? Math.min(1, Math.max(0, -r.top / span)) : 0;
    };
    this.onMove = (e) => {
      this.mx = (e.clientX / window.innerWidth - 0.5) * 2;
      this.my = (e.clientY / window.innerHeight - 0.5) * 2;
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('mousemove', this.onMove, { passive: true });
    this.onScroll();
    this.boot();
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('mousemove', this.onMove);
    if (this.ro) this.ro.disconnect();
    if (this.renderer) { this.renderer.dispose(); this.renderer.domElement.remove(); }
  }

  blade(THREE) {
    const D = 1.0, R = 0.769, CH = 0.620, AX = 0.7546, CY = 0.852, CTL = 0.740;
    const s = new THREE.Shape();
    s.moveTo(CH, D);
    s.lineTo(-CH, D);
    s.quadraticCurveTo(-CTL, D, -AX, CY);
    s.absarc(0, D, R, Math.PI * 1.0617, Math.PI * 1.9383, false);
    s.quadraticCurveTo(CTL, D, CH, D);
    return s;
  }

  async boot() {
    const THREE = await import('https://esm.sh/three@0.161.0');
    const el = this.mount; if (!el) return;
    const w = el.clientWidth || 800, h = el.clientHeight || 700;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.24;
    renderer.domElement.style.display = 'block';
    el.appendChild(renderer.domElement);
    this.renderer = renderer;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, w / h, 0.1, 100);

    const geo = new THREE.ExtrudeGeometry(this.blade(THREE), {
      depth: 0.05, bevelEnabled: true, bevelThickness: 0.011, bevelSize: 0.011, bevelSegments: 2, curveSegments: 30
    });
    geo.rotateX(-Math.PI / 2);

    const mA = new THREE.MeshStandardMaterial({ color: 0x121215, metalness: 0.66, roughness: 0.36 });
    const mB = new THREE.MeshStandardMaterial({ color: 0x1D1D21, metalness: 0.52, roughness: 0.46 });
    const mHot = new THREE.MeshStandardMaterial({ color: 0xFF6028, emissive: 0xFF3B00, emissiveIntensity: 0.72, metalness: 0.26, roughness: 0.33 });

    const stack = new THREE.Group();
    const N = 14;
    this.strata = [];
    for (let i = 0; i < N; i++) {
      const layer = new THREE.Group();
      const t = i / (N - 1);
      const mat = (i === 3 || i === 10) ? mHot : (i % 2 ? mB : mA);
      for (let b = 0; b < 3; b++) {
        const m = new THREE.Mesh(geo, mat);
        m.rotation.y = (b / 3) * Math.PI * 2;
        const s = 1 - Math.abs(t - 0.5) * 0.14;
        m.scale.set(s, 1, s);
        layer.add(m);
      }
      layer.userData.base = i - (N - 1) / 2;
      stack.add(layer);
      this.strata.push(layer);
    }
    scene.add(stack);

    scene.add(new THREE.HemisphereLight(0x3C3C48, 0x07070A, 0.8));
    const key = new THREE.DirectionalLight(0xFFFFFF, 2.3); key.position.set(3.6, 6.4, 3.2); scene.add(key);
    const rim = new THREE.DirectionalLight(0xFFFFFF, 1.2); rim.position.set(-4.4, 1.2, -3.6); scene.add(rim);
    const glow = new THREE.PointLight(0xFF6028, 24, 14, 2); glow.position.set(-2, -1.2, 2.4); scene.add(glow);

    this.ro = new ResizeObserver(() => {
      const nw = el.clientWidth, nh = el.clientHeight;
      if (!nw || !nh) return;
      renderer.setSize(nw, nh); camera.aspect = nw / nh; camera.updateProjectionMatrix();
    });
    this.ro.observe(el);

    const paths = this.anno ? Array.from(this.anno.querySelectorAll('[data-draw]')) : [];
    const lens = paths.map(p => p.getTotalLength ? p.getTotalLength() : 300);
    let cx = 3.0, cy = 1.4;

    const tick = () => {
      this.raf = requestAnimationFrame(tick);
      this.p += (this.pt - this.p) * 0.075;
      const p = this.p;

      const gap = 0.0505 + p * 0.32;
      for (let i = 0; i < this.strata.length; i++) {
        const L = this.strata[i];
        L.position.y = L.userData.base * gap;
        L.rotation.y = i * p * 0.13;
      }
      stack.rotation.y = p * 0.55;
      stack.position.y = -p * 0.2;

      const rad = 0.04 + p * 3.1;
      cx += ((rad * 0.7071 + this.mx * 0.34) - cx) * 0.055;
      cy += ((5.2 - p * 3.1 - this.my * 0.26) - cy) * 0.055;
      camera.position.set(cx, cy, rad * 0.7071);
      camera.lookAt(0, 0, 0);

      const t = Math.min(1, Math.max(0, (p - 0.16) / 0.3));
      if (this.ha) { this.ha.style.transform = 'translateY(' + (-t * 108) + '%)'; this.ha.style.opacity = String(1 - t); }
      if (this.hb) { this.hb.style.transform = 'translateY(' + ((1 - t) * 108) + '%)'; this.hb.style.opacity = String(t); }

      const d = Math.min(1, Math.max(0, (p - 0.06) / 0.4));
      for (let i = 0; i < paths.length; i++) {
        const local = Math.min(1, Math.max(0, (d - i * 0.12) / 0.5));
        paths[i].style.strokeDashoffset = String(lens[i] * (1 - local));
      }
      if (this.bar) this.bar.style.width = (p * 100) + '%';

      renderer.render(scene, camera);
    };
    tick();
  }
}

</script>
</body>
</html>
